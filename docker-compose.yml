# Local development environment for Atlas AI platform.
#
#   docker compose up --build
#
# Spins up:
#   - web      : Next.js 14 app (http://localhost:3000)
#   - agent    : Python FastAPI agent backend (http://localhost:8000)
#
# The web app's server-side env vars (service-role key, Resend, admin creds,
# etc.) are read from the root .env — the same file used by the Python agent.

version: "3.8"

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time — must be available.
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://jbmccmokfvyvijmumuzn.supabase.co}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Server-side secrets passed through from .env
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-kalafatasagapitos@gmail.com}
      ADMIN_USER: ${ADMIN_USER:-agapitos}
      ADMIN_PASS: ${ADMIN_PASS:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SUPABASE_WEBHOOK_SECRET: ${SUPABASE_WEBHOOK_SECRET:-}
    depends_on:
      - agent

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: development
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
