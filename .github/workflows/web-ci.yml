name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Next.js app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Disposable CI-only values. No Production credentials are available here.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-server-placeholder
      ADMIN_USER: ci-admin
      ADMIN_PASS: ci-only-placeholder-password
      AUTH_SECRET: ci-only-placeholder-secret-with-more-than-32-bytes
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Production build
        run: npm run build
