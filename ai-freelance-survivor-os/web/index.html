<!doctype html><html><head><meta charset="utf-8"><title>AI Freelance Survivor</title><style>body{font-family:Inter,system-ui;margin:0;background:#f4f6f8;color:#111}.wrap{max-width:1200px;margin:32px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px}.big{font-size:28px;font-weight:700}.mono{font-family:ui-monospace,monospace}.actions button{margin-right:8px;padding:10px 14px}.events{background:#0e1116;color:#d7f7df;padding:16px;border-radius:12px;height:360px;overflow:auto}.event{margin:5px 0;font-size:13px}</style></head><body><div class="wrap"><h1>AI Freelance Survivor</h1><div class="actions"><button onclick="post('/api/ai/start')">Start</button><button onclick="post('/api/ai/pause')">Pause</button><button onclick="post('/api/ai/resume')">Resume</button></div><div class="grid" id="metrics"></div><h2>Pending approvals</h2><div id="approvals"></div><h2>Live activity</h2><div class="events" id="events"></div></div><script>
async function post(u){await fetch(u,{method:'POST'});load()} async function load(){const s=await (await fetch('/api/ai/state')).json();document.getElementById('metrics').innerHTML=[['State',s.agent.state],['Balance','€'+s.wallet.balance.toFixed(2)],['Revenue','€'+s.wallet.revenue.toFixed(2)],['Profit','€'+s.wallet.profit.toFixed(2)]].map(x=>`<div class="card"><div>${x[0]}</div><div class="big">${x[1]}</div></div>`).join('');document.getElementById('approvals').innerHTML=s.approvals.filter(a=>a.status==='PENDING').map(a=>`<div class="card"><b>${a.type}</b><br>${a.description}<br><button onclick="approve('${a.id}')">Approve</button></div>`).join('')||'<p>None</p>';renderEvents(s.events)} async function approve(id){await fetch('/api/ai/approvals/'+id+'/approve',{method:'POST'});load()} function renderEvents(es){document.getElementById('events').innerHTML=es.slice().reverse().map(e=>`<div class="event"><span class="mono">${e.ts}</span> ${e.name} ${JSON.stringify(e.data)}</div>`).join('')}new EventSource('/api/ai/events').onmessage=e=>{const el=document.getElementById('events');const d=JSON.parse(e.data);el.innerHTML=`<div class="event"><span class="mono">${d.ts}</span> ${d.name} ${JSON.stringify(d.data)}</div>`+el.innerHTML};load();</script></body></html>
