<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI Freelance Survivor</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Inter,system-ui,-apple-system,sans-serif;margin:0;background:#0f1117;color:#e6e8ee}
  .wrap{max-width:1200px;margin:32px auto;padding:0 20px}
  h1{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#8b93a7;margin:28px 0 12px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
  .actions button,.btn{padding:9px 16px;border-radius:8px;border:1px solid #2c3140;background:#1b1f2a;color:#e6e8ee;font-size:14px;cursor:pointer}
  .actions button:hover,.btn:hover{background:#232838}
  .btn{padding:5px 10px;font-size:12px;border-radius:6px;white-space:nowrap}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
  .card{background:#161a24;border:1px solid #262c3a;border-radius:12px;padding:16px}
  .card .label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#8b93a7}
  .card .big{font-size:30px;font-weight:700;margin-top:6px}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid;margin-left:8px}
  .pill.ok{color:#59e0a5;border-color:rgba(89,224,165,.4)}
  .pill.wait{color:#f0b45a;border-color:rgba(240,180,90,.4)}
  .pill.bad{color:#f06e6e;border-color:rgba(240,110,110,.4)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #20242f}
  .row:last-child{border-bottom:none}
  .muted{color:#8b93a7;font-size:13px}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#232838;color:#aeb6c6;white-space:nowrap}
  .tag.ok{background:rgba(89,224,165,.12);color:#59e0a5}
  .tag.wait{background:rgba(240,180,90,.12);color:#f0b45a}
  .tag.bad{background:rgba(240,110,110,.12);color:#f06e6e}
  .col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .events{background:#0b0d12;border:1px solid #1e222d;padding:16px;border-radius:12px;height:320px;overflow:auto}
  .event{margin:4px 0;font-size:12px;color:#c9d3e0}
  .event .ts{color:#5c6b8a;margin-right:8px}
  @media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.col{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Freelance Survivor <span id="statePill"></span></h1>
  <div class="actions">
    <button onclick="post('/api/ai/start')">Start / Scan market</button>
    <button onclick="post('/api/ai/pause')">Pause</button>
    <button onclick="post('/api/ai/resume')">Resume</button>
  </div>
  <div class="grid" id="metrics"></div>

  <h2>Market opportunities</h2>
  <div class="card" id="opportunities"></div>

  <h2>Pending approvals</h2>
  <div class="card" id="approvals"></div>

  <h2>Proposals</h2>
  <div class="card" id="proposals"></div>

  <h2>Jobs</h2>
  <div class="card" id="jobs"></div>

  <div class="col">
    <div>
      <h2>Ledger</h2>
      <div class="card" id="ledger"></div>
    </div>
    <div>
      <h2>Memory</h2>
      <div class="card" id="memory"></div>
    </div>
  </div>

  <h2>Live activity</h2>
  <div class="events" id="events"></div>
</div>
<script>
const fmt = n => '€' + (Number(n)||0).toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag = (t,cls) => '<span class="tag '+(cls||t.toLowerCase())+'">'+t+'</span>';
const jobTag = st => {
  const cls = ['PAID','DELIVERED','WON'].includes(st) ? 'ok' : ['FAILED','LOST','CANCELLED'].includes(st) ? 'bad' : 'wait';
  return '<span class="tag '+cls+'">'+st+'</span>';
};
async function post(u){ await fetch(u,{method:'POST'}); load(); }
function statePill(st){
  const cls = (st==='PAUSED'||st==='DEAD'||st==='ERROR') ? 'bad' : (st==='AWAITING_APPROVAL'||st==='EVALUATING'||st==='VERIFYING') ? 'wait' : 'ok';
  document.getElementById('statePill').innerHTML = '<span class="pill '+cls+'">'+esc(st)+'</span>';
}
async function load(){
  const s = await (await fetch('/api/ai/state')).json();
  statePill(s.agent.state);
  document.getElementById('metrics').innerHTML = [
    ['Agent state', s.agent.state, 'strategy ' + s.agent.strategy],
    ['Balance', fmt(s.wallet.balance), 'survival ' + s.wallet.state],
    ['Revenue', fmt(s.wallet.revenue), 'net profit ' + fmt(s.wallet.profit)],
    ['Expenses', fmt(s.wallet.expenses), 'EUR']
  ].map(x => '<div class="card"><div class="label">'+x[0]+'</div><div class="big">'+x[1]+'</div><div class="muted">'+x[2]+'</div></div>').join('');

  document.getElementById('opportunities').innerHTML = s.opportunities.map(o =>
    '<div class="row"><div><b>'+esc(o.title)+'</b> <span class="muted">'+esc(o.clientName)+' · '+o.clientRating+'/5</span></div>' +
    '<div class="muted">'+fmt(o.budget)+' · '+o.estimatedHours+'h · competition '+(o.competition*100).toFixed(0)+'% · score '+(s.scores[o.id]?s.scores[o.id].overall:'–')+'</div></div>'
  ).join('') || '<p class="muted">No market yet — press Start.</p>';

  document.getElementById('approvals').innerHTML = s.approvals.filter(a=>a.status==='PENDING').map(a =>
    '<div class="row"><div><b>'+esc(a.type)+'</b> &nbsp;<span class="muted">'+esc(a.description)+'</span></div>' +
    '<button class="btn" onclick="approve(\''+a.id+'\')">Approve</button></div>'
  ).join('') || '<p class="muted">None pending.</p>';

  document.getElementById('proposals').innerHTML = s.proposals.map(p => {
    const o = s.opportunities.find(x=>x.id===p.opportunityId);
    const done = s.jobs.some(j=>j.opportunityId===p.opportunityId && (j.state==='PAID'||j.state==='FAILED'));
    return '<div class="row"><div><b>'+esc(o?o.title:p.opportunityId)+'</b> '+tag(p.status)+
      '<br><span class="muted">'+esc(p.text.slice(0,140))+'…</span></div>' +
      (done ? '' : '<button class="btn" onclick="pay(\''+p.opportunityId+'\')">Simulate payment</button>') + '</div>';
  }).join('') || '<p class="muted">Nothing submitted yet.</p>';

  document.getElementById('jobs').innerHTML = s.jobs.length ?
    s.jobs.map(j => '<div class="row"><div><b>'+esc(j.title)+'</b> '+jobTag(j.state)+'</div>' +
      '<div class="muted">'+fmt(j.revenue)+' · net '+fmt(j.profit)+'</div></div>').join('') :
    '<p class="muted">No jobs yet.</p>';

  document.getElementById('ledger').innerHTML = s.transactions.slice().reverse().map(t =>
    '<div class="row"><div>'+esc(t.type)+' <span class="muted">'+esc(t.description)+'</span></div>' +
    '<div class="mono">'+(t.amount>0?'+':'')+fmt(t.amount)+' · bal '+fmt(t.balanceAfter)+'</div></div>'
  ).join('') || '<p class="muted">No ledger entries.</p>';

  document.getElementById('memory').innerHTML = s.memories.slice().reverse().map(m =>
    '<div class="row"><div class="muted">'+esc(m.text)+'</div><div class="tag">'+m.kind.toLowerCase()+' · imp '+(m.importance*10).toFixed(0)+'</div></div>'
  ).join('') || '<p class="muted">No memories yet.</p>';

  renderEvents(s.events);
}
async function approve(id){ await fetch('/api/ai/approvals/'+id+'/approve',{method:'POST'}); load(); }
async function pay(oid){ await fetch('/api/ai/simulate-payment/'+oid,{method:'POST'}); load(); }
function renderEvents(es){ document.getElementById('events').innerHTML = es.slice().reverse().map(e =>
  '<div class="event"><span class="ts mono">'+esc(e.ts)+'</span> '+esc(e.name)+' '+esc(JSON.stringify(e.data))+'</div>'
).join(''); }
new EventSource('/api/ai/events').onmessage = e => {
  const el=document.getElementById('events');
  const d=JSON.parse(e.data);
  el.innerHTML = '<div class="event"><span class="ts mono">'+esc(d.ts)+'</span> '+esc(d.name)+' '+esc(JSON.stringify(d.data))+'</div>' + el.innerHTML;
};
load();
</script>
</body>
</html>
